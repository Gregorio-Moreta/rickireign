    - region "Where the work comes from." [ref=f1e47]:
      - generic [ref=f1e50]:
        - paragraph [ref=f1e51]: Meet Reign
        - heading "Where the work comes from." [level=2] [ref=f1e52]
        - generic [ref=f1e53]:
          - paragraph [ref=f1e54]: Ricki Reign is a community facilitator and strategist. She works alongside founders, executives, and community leaders, helping them lead from steadiness — making decisions from a settled place rather than from pressure.
          - paragraph [ref=f1e55]: "Her path didn't begin in a boardroom. It began in the body: years of somatic practice, and learning — often the hard way — that the quality of a person's presence shapes everything downstream of it. That conviction now threads through everything she builds."
          - paragraph [ref=f1e56]: Today the work takes three shapes. She founded and leads Exhale Under Pressure, helping leaders who carry real weight stay resourced, and Community Birth Village, offering community-rooted birth support. Alongside them she keeps a personal embodiment practice — the one-to-one room where all of this began.
          - paragraph [ref=f1e57]: "What ties it together is a single question: what becomes possible when people lead from presence instead of pressure? Her work is to help them find out — with warmth, rigor, and real respect for where people come from."
