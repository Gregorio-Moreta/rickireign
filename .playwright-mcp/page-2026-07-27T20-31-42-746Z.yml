    - region "Where the work comes from." [ref=f26e47]:
      - generic [ref=f26e50]:
        - paragraph [ref=f26e51]: Meet Reign
        - heading "Where the work comes from." [level=2] [ref=f26e52]
        - generic [ref=f26e53]:
          - paragraph [ref=f26e54]: Ricki Reign is a community facilitator and strategist. She works alongside founders, executives, and community leaders, helping them lead from steadiness — making decisions from a settled place rather than from pressure.
          - paragraph [ref=f26e55]: "Her path didn't begin in a boardroom. It began in the body: years of somatic practice, and learning — often the hard way — that the quality of a person's presence shapes everything downstream of it. That conviction now threads through everything she builds."
          - paragraph [ref=f26e56]: Today the work takes three shapes. She founded and leads Exhale Under Pressure, helping leaders who carry real weight stay resourced, and Community Birth Village, offering community-rooted birth support. Alongside them she keeps a personal embodiment practice — the one-to-one room where all of this began.
          - paragraph [ref=f26e57]: "What ties it together is a single question: what becomes possible when people lead from presence instead of pressure? Her work is to help them find out — with warmth, rigor, and real respect for where people come from."
